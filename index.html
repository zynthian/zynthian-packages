<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zynthian Package Browser</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <!-- Bootstrap 5 CSS via jsDelivr CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
    <style>
        body { background-color: #f8f9fa; font-family: sans-serif; }
        .package-card { height: 100%; transition: transform 0.2s, box-shadow 0.2s; border: none; border-radius: 10px; overflow: hidden; }
        .package-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .card-img-container { height: 160px; background-color: #eaeaea; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .card-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .badge-category { position: absolute; top: 10px; right: 10px; font-size: 0.75rem; z-index: 10; }
        .description-text { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-size: 0.9rem; color: #555; }
        .meta-spec { font-size: 0.8rem; font-weight: 600; color: #6c757d; }
        .bg-black {
            background-color: #0f1115 !important; /* Premium slate-black color matching synth panels */
        }
        .navbar-brand img {
            filter: drop-shadow(0 0 4px rgba(255,255,255,0.1));
        }
        .postlogo {
            color: #862121;
            font-family: arial;
            font-size: 18px;
            font-weight: normal;
        }
        .postlogo a {
            color: #862121;
            text-decoration: none;
        }
        .postlogo a:hover {
            color: #B65151;
            text-decoration: none;
        }
    </style>
    
</head>
<body>

<!-- Zynthian Official Brand Header Bar with Right-Aligned Navigation Menu -->
<nav class="navbar navbar-expand-lg navbar-dark bg-black py-3 mb-5 border-bottom border-secondary border-opacity-25">
    <div class="container">
        
        <a class="navbar-brand d-flex align-items-center gap-3" href="https://zynthian.org" target="_blank">
            <img src="https://zynthian.org/user/themes/hola/images/logo/logo.png" 
                 alt="Zynthian Logo" 
                 height="32" 
                 class="d-inline-block align-top"></a>

        <!-- Responsive Hamburger Toggle Button for Mobile Navigation Screens -->
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#zynthianNavbarMenu" aria-controls="zynthianNavbarMenu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Right-Aligned Target Link Menu Group -->
        <div class="collapse navbar-collapse justify-content-end" id="zynthianNavbarMenu">
            <ul class="navbar-nav gap-lg-2 text-uppercase font-monospace pt-3 pt-lg-0" style="font-size: 0.8rem; letter-spacing: 1px;">
                <li class="nav-item">
                    <a class="nav-link text-white-90 text-hover-white px-3" href="https://zynthian.org" target="_blank">Concept</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white-90 text-hover-white px-3" href="https://shop.zynthian.org" target="_blank">Shop</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white-90 text-hover-white px-3" href="https://discourse.zynthian.org" target="_blank">Forum</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white-90 text-hover-white px-3" href="https://wiki.zynthian.org" target="_blank">Wiki</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white-90 text-hover-white px-3" href="https://blog.zynthian.org" target="_blank">Blog</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Container Restructured Content Grid -->
<div class="container mb-5">
    <header class="text-left mb-5">
        <h2 class="fw-bold">Package Catalog <span class="postlogo"><a href="https://github.com/zynthian/zynthian-packages">[repository]</a></span></h2>
        <p class="text-muted">Browse, search, and discover official instrument packages and sound expansions</p>
    </header>

    <!-- Filters and Search Toolbar Controls -->
    <div class="row g-3 mb-4 justify-content-between align-items-center">
        <div class="col-md-6">
            <div class="btn-group" role="group" id="categoryFilters">
                <button type="button" class="btn btn-outline-dark active" data-filter="all">All Packages</button>
                <button type="button" class="btn btn-outline-dark" data-filter="Soundfonts">Soundfonts</button>
                <button type="button" class="btn btn-outline-dark" data-filter="IRs">IRs</button>
                <button type="button" class="btn btn-outline-dark" data-filter="Samples">Samples</button>
            </div>
        </div>
        <div class="col-md-4">
            <input type="text" id="searchBar" class="form-control" placeholder="Search by title, author, or keywords...">
        </div>
    </div>

    <!-- The Target Render Layout Element Grid -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="packageGrid">
        <div class="col-12 text-center my-5 w-100" id="loadingState">
            <div class="spinner-border text-dark" role="status"></div>
            <p class="mt-2 text-muted">Reading package array configuration mapping index...</p>
        </div>
    </div>
</div>

<script>
    // Global dataset states
    let allPackages = [];
    let currentFilter = 'all';
    let searchQuery = '';

    // Adjust repository pointer constants to match your target asset deployment setup
    const RAW_BASE_URL = "https://zynthian.github.io/zynthian-packages";

    async function initializeCatalog() {
        try {
            // Fetch compiled indexes straight out of root folder JSON tracking configuration file
            const response = await fetch('./packages.json');
            if (!response.ok) throw new Error("Could not find or fetch target packages.json file.");
            
            // Native JSON parsing—no external parsing library required
            allPackages = await response.json();
            
            renderGrid();
            setupEventListeners();
        } catch (error) {
            console.error(error);
            document.getElementById('packageGrid').innerHTML = `
                <div class="alert alert-danger w-100 text-center" role="alert">
                    <strong>Error:</strong> Unable to process package configurations. Please check if your GitHub Action has compiled packages.json successfully.
                </div>`;
        }
    }

    function renderGrid() {
        const gridElement = document.getElementById('packageGrid');
        gridElement.innerHTML = ''; // Wipe loader or old items

        // Perform composite processing filtration routines
        const filtered = allPackages.filter(pkg => {
            const matchesCategory = currentFilter === 'all' || pkg.category === currentFilter;
            const cleanSearch = searchQuery.toLowerCase();
            const matchesSearch = !searchQuery || 
                (pkg.title && pkg.title.toLowerCase().includes(cleanSearch)) ||
                (pkg.author && pkg.author.toLowerCase().includes(cleanSearch)) ||
                (pkg.description && pkg.description.toLowerCase().includes(cleanSearch));
                
            return matchesCategory && matchesSearch;
        });

        if (filtered.length === 0) {
            gridElement.innerHTML = `<div class="text-center text-muted my-5 w-100">No packages match your search selection options.</div>`;
            return;
        }

        filtered.forEach(pkg => {
            // Safe, dynamic URL construction using array splitting to avoid syntax framework text-clipping issues
            let imgUrl = "";
            if (pkg.icon && pkg.category && pkg.id) {
                imgUrl = [pkg.category, pkg.id, pkg.icon].join('/');
            }
            
            const col = document.createElement('div');
            col.className = 'col';
            
            // Build internal sub-elements safely outside the core template literal
            let imageHTML = `<div class="text-muted text-uppercase fw-bold">${pkg.category || 'Package'}</div>`;
            if (imgUrl) {
                imageHTML = `<img src="${imgUrl}" alt="${pkg.title || 'Preview'}">`;
            }

            let sourceButtonHTML = "";
            if (pkg.source_url) {
                sourceButtonHTML = `<a href="${pkg.source_url}" target="_blank" class="btn btn-sm btn-dark mt-3 w-100">View Source Project</a>`;
            }

            col.innerHTML = `
                <div class="card package-card shadow-sm position-relative">
                    <span class="badge bg-dark badge-category">${pkg.category || 'General'}</span>
                    <div class="card-img-container">
                        ${imageHTML}
                    </div>
                    <div class="card-body d-flex flex-column justify-content-between p-4">
                        <div>
                            <h5 class="card-title fw-bold mb-1">${pkg.title || 'Untitled Package'}</h5>
                            <p class="text-muted small mb-3">By ${pkg.author || 'Unknown Author'}</p>
                            <p class="card-text description-text mb-4">${pkg.description || 'No description provided.'}</p>
                        </div>
                        <div class="mt-auto pt-3 border-top d-flex justify-content-between align-items-center">
                            <span class="meta-spec">📦 Size: ${pkg.size || 'N/A'}</span>
                            <span class="meta-spec">⚖️ License: ${pkg.license || 'N/A'}</span>
                        </div>
                        ${sourceButtonHTML}
                    </div>
                </div>
            `;
            gridElement.appendChild(col);
        });
    }

    function setupEventListeners() {
        // Textual live filter binding pipelines
        document.getElementById('searchBar').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderGrid();
        });

        // Category button filter click groups 
        document.getElementById('categoryFilters').addEventListener('click', (e) => {
            if (!e.target.matches('button')) return;
            
            // Manage visual toggle selector highlight properties
            document.querySelectorAll('#categoryFilters button').forEach(btn => btn.classList.remove('active'));
            e.target.classList.add('active');

            currentFilter = e.target.getAttribute('data-filter');
            renderGrid();
        });
    }

    // Fire operation on document mount tracking loops
    initializeCatalog();
</script>

</body>
</html>
