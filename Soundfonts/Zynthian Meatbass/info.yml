description: "Karoryfer Meatbass for Zynthian. This an upright bass plucked (pizzicato), intended to be suitable for jazz/blues/bluegrass on Zynthian. It is a reduced version of Karoryfer Meatbass, which is freely available at <a href='https://shop.karoryfer.com/pages/free-samples'>Karoryfer</a>.

This version was reduced from the original by Jeff Learman.

Notes above SPN C5 (an octave above Middle C) are common percussive noises made on the bass, such as slaps.

<b>Controls</b><br/>
- cc7 - Master Vol
- cc10 - Master Pan
- cc100 - Attack
- cc101 - Hold
- cc102 - Decay
- cc103 - Sustain
- cc104 - Release
- cc111 - Vibrato Depth
- cc112 - Vibrato Speed
- cc115 - Vibrato Delay
- cc116 - Vibrato Fadev
- cc117 - Humanize Rate
- cc118 - Uneven Pitch
- cc119 - Unsteady Vibrato

<b>From original README for Karoryfer Meatbass</b><br/>
Meatbass is a sample library for Plogue Sforzando version 1.845 or newer. It contains samples of a 1958 Otto Rubner double bass played and mapped by Drogomir Smolken, recorded by Ludwik Zamenhof.
Fifths tuning (CGDA), Thomastik-Infeld Spirocore strings. F.G. Pfretzschner bow, Pops' rosin.

Plucked notes with four velocity layers and four round robins, and percussive noises with round robins, above the notes"
