description: "A granular delay whose grains hop around the buffer like bouncing balls.<br/>

The input is recorded into a 3 s buffer, and the sound comes back as many short grains read from it. A bouncing ball makes the grains hop between positions in the buffer, which gives the plugin its character.
"
