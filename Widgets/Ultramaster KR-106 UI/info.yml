description: |
  Touchscreen UI widget for the original Ultramaster KR-106 LV2 synthesizer on Zynthian Tomita.

  Four pages (SYNTH, ENV, PLAY, SET), responsive header, touch controls,
  hardware encoder navigation, and access to native controls / MIDI Learn.
  Requires the original KR-106 LV2 plugin (https://kayrock.org/kr106).
  Installs only a Python/Tk widget in lv2-widgets; no DSP or synth binaries.
